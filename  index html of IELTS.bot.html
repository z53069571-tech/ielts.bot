<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11295f">
<title>ZM IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ielts_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
 --bg:#f4f5fa;--sf:#ffffff;--sf2:#eef0f7;--ink:#0f1222;--mu:#667085;--ln:#e4e7f0;
 --ac:#4f46e5;--ac2:#7c3aed;--acs:rgba(79,70,229,.1);--ok:#059669;--no:#dc2626;
 --sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px -8px rgba(16,24,40,.08);
 --shl:0 2px 4px rgba(16,24,40,.05),0 18px 40px -16px rgba(16,24,40,.18);
 --ser:"Instrument Serif",Georgia,"Times New Roman",serif;--r:18px}
[data-theme=dark]{
 --bg:#0a0c13;--sf:#12151f;--sf2:#181c29;--ink:#eef0f6;--mu:#8b93a7;--ln:#232838;
 --ac:#818cf8;--ac2:#a78bfa;--acs:rgba(129,140,248,.14);--ok:#34d399;--no:#f87171;
 --sh:0 1px 2px rgba(0,0,0,.3);--shl:0 18px 40px -16px rgba(0,0,0,.6)}
html{color-scheme:light}[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
::selection{background:var(--ac);color:#fff}
body{margin:0;font:15px/1.65 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
h1,h2,.bn,.big,.score big,.sk b{font-family:var(--ser);font-weight:400;letter-spacing:-.015em}
h1{font-size:42px;line-height:1.08;margin:0 0 6px}h2{font-size:30px;line-height:1.15;margin:0 0 10px}
h3{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin:34px 0 14px}
.mu{color:var(--mu);margin:0 0 22px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--mu);background-clip:padding-box;border:2px solid transparent}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;gap:12px;align-items:center;padding:2px 10px 24px}
.mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;box-shadow:0 8px 20px -8px var(--ac)}
.brand b{display:block;line-height:1.15;font-size:16px;letter-spacing:-.01em}.brand small{color:var(--mu);font-size:12px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--mu);cursor:pointer;border:0;background:none;font:inherit;font-weight:500;text-align:left;width:100%;position:relative;transition:background .15s,color .15s}
.nv:hover{background:var(--sf2);color:var(--ink)}
.nv.on{background:var(--acs);color:var(--ac);font-weight:600}
.nv.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--ac)}
.sbf{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid var(--ln)}
.tg{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.tg:hover{border-color:var(--ac)}.tg svg{display:block}
.tg.sm{width:34px;height:34px;padding:0;justify-content:center;border-color:#3a3f52;background:transparent;color:#fff;border-radius:999px}
.tg .sn,.tg .l2{display:none}[data-theme=dark] .tg .sn,[data-theme=dark] .tg .l2{display:inline-flex}[data-theme=dark] .tg .mn,[data-theme=dark] .tg .l1{display:none}
main{padding:44px 48px 60px;max-width:1120px;width:100%}
main>*{animation:fade .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:48px;display:grid;grid-template-columns:1.5fr 1fr;gap:32px;align-items:end;margin-bottom:26px;
 background:radial-gradient(600px 300px at 90% -10%,rgba(167,139,250,.55),transparent 60%),radial-gradient(500px 300px at -5% 110%,rgba(56,189,248,.35),transparent 60%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#4338ca);
 box-shadow:var(--shl)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:linear-gradient(120deg,#000,transparent 70%);mask-image:linear-gradient(120deg,#000,transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:54px;margin:0 0 14px}.hero p{margin:0 0 28px;opacity:.78;max-width:440px}
.hr{border-left:1px solid rgba(255,255,255,.22);padding-left:30px}.hr span{opacity:.75;font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.bn{font-size:100px;line-height:1.05}.hr small{display:block;opacity:.75;max-width:240px}
.hb{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,color .2s,filter .2s}
.b i{font-style:normal;transition:transform .2s}.b:hover i{transform:translateX(4px)}.b:active{transform:scale(.97)}
.b.d,.b.a{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 20px -10px var(--ac)}
.b.d:hover,.b.a:hover{box-shadow:0 12px 26px -10px var(--ac);filter:brightness(1.06)}
.b.w{background:#fff;color:#1e1b4b}.b.w:hover{box-shadow:0 12px 28px -10px rgba(255,255,255,.7)}
.b.o{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.35)}.b.o:hover{background:#fff;color:#1e1b4b}
.b[disabled]{opacity:.45;cursor:default;box-shadow:none}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.sk[data-g=listening],.ci[data-k=listening]{--c:#0ea5e9}
.sk[data-g=reading],.ci[data-k=reading]{--c:#10b981}
.sk[data-g=writing],.ci[data-k=writing]{--c:#f59e0b}
.sk[data-g=speaking],.ci[data-k=speaking]{--c:#f43f5e}
.sk{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh);transition:transform .2s,border-color .2s,box-shadow .2s}
.sk:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:var(--shl)}
.sk span{display:flex;align-items:center;gap:11px;color:var(--ink);font-weight:600}
.sk span svg{width:36px;height:36px;padding:8px;border-radius:11px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.sk b{font-size:52px;line-height:1}
.sk i{display:block;height:5px;background:var(--sf2);border-radius:5px;overflow:hidden}
.sk u{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.row{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:14px;box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--ac)}
.row small{display:block;color:var(--mu);font-size:13px}
.rl{display:flex;align-items:center;gap:14px}
.ci{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--ac)) 14%,transparent);color:var(--c,var(--ac))}

/* ---------- Exam window ---------- */
#ex{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}#ex[hidden]{display:none}
.xh{background:#05060b;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;font-size:14px;border-bottom:1px solid #1b1f2e}
.xr{display:flex;align-items:center;gap:12px;color:#aab0c2}
.xh b{font-variant-numeric:tabular-nums;font-size:15px;color:#fff;background:#151929;border:1px solid #262b3f;padding:4px 12px;border-radius:8px;min-width:68px;text-align:center}
.xh b.low{color:#fca5a5;border-color:#7f1d1d;background:#2a0f12;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.lg{background:#fff;color:#000;padding:3px 10px;border-radius:6px;font-weight:800;letter-spacing:1.5px;font-size:13px}
.xq{background:none;border:1px solid #3a3f52;color:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;font:inherit;font-size:13px;transition:background .15s,color .15s}.xq:hover{background:#fff;color:#000}
.xmain{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pane{overflow:auto;padding:28px 34px;background:var(--sf)}.pane.r{background:var(--bg);border-left:1px solid var(--ln)}
.pane h2{font-size:28px}
.pane p{max-width:62ch}
.q{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s}
.q.cur{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.q p{margin:0 0 10px;font-weight:500}
.n{display:inline-grid;place-items:center;min-width:26px;height:26px;margin-right:8px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px}
.q .o{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin:4px 0;border:1px solid var(--ln);border-radius:12px;cursor:pointer;transition:background .12s,border-color .12s}
.q .o:hover{background:var(--sf2)}
.q .o.on{background:var(--acs);border-color:var(--ac)}
.q .o i{flex:none;width:18px;height:18px;margin-top:3px;border:2px solid var(--mu);border-radius:50%;transition:all .12s}
.q .o.on i{border-color:var(--ac);background:var(--ac);box-shadow:inset 0 0 0 3px var(--sf)}
input.gap,textarea{font:inherit;color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;width:100%;background:var(--bg);transition:border-color .15s,box-shadow .15s}
input.gap:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
input.gap{max-width:280px}
textarea{height:100%;min-height:320px;resize:none;line-height:1.7;background:var(--sf)}
.flag{float:right;border:0;background:none;color:var(--mu);cursor:pointer;font:inherit;font-size:13px}.flag:hover{color:var(--ink)}.flag.on{color:#d97706;font-weight:700}
.ft{border-top:1px solid var(--ln);background:var(--sf);display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}
.nums{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center;color:var(--mu);font-size:13px}
.nb{min-width:34px;height:34px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer;border-radius:10px;transition:all .12s}
.nb:hover{border-color:var(--ac)}
.nb.done{background:var(--ac);color:#fff;border-color:var(--ac)}.nb.cur{outline:2px solid var(--ac);outline-offset:2px}.nb.fl{border:2px dashed #d97706}
.tab{border:1px solid var(--ln);background:var(--bg);color:var(--ink);padding:8px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:500;border-radius:999px;transition:all .12s}.tab:hover{border-color:var(--ac)}.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.intro,.res,.spk{max-width:720px;margin:0 auto;padding:56px 24px;overflow:auto;flex:1;width:100%}
.intro p{font-size:16px;color:var(--mu);margin:0 0 28px}
.intro h2,.res h2{font-size:38px}
.score{display:flex;gap:28px;align-items:center;margin:16px 0 22px;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:22px 26px;box-shadow:var(--sh)}
.score big{font-size:72px;line-height:1;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rv{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;margin-bottom:8px}.rv small{display:block;color:var(--mu)}
.ok{font-weight:700;color:var(--ok)}.no{color:var(--no);font-weight:700}
details{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
table{border-collapse:separate;border-spacing:0;margin:10px 0 16px;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--sf)}
td,th{border-bottom:1px solid var(--ln);padding:10px 18px;text-align:left}tr:last-child td{border-bottom:0}th{background:var(--sf2);font-size:13px;font-weight:600}
.cue{border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:20px 24px;margin:16px 0;background:var(--sf);box-shadow:var(--sh)}.big{font-size:48px}
mark{background:#fde68a;color:#111;border-radius:3px;padding:0 2px}
#lg{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:radial-gradient(600px 400px at 80% 0%,var(--acs),transparent 60%),var(--bg)}#lg[hidden]{display:none}
#lg h1{font-size:40px;margin:0}
.eb{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ac);margin-bottom:12px}
.eb::before{content:"";width:18px;height:2px;background:var(--ac);border-radius:2px}
.ph{margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--ln)}
.ph h1{margin:0 0 8px}.ph .mu{margin:0;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px;min-width:0}
.stat .ci{width:46px;height:46px}
.stat small{display:block;color:var(--mu);font-size:12px;font-weight:500}
.stat b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin:36px 0 14px}.sec h3{margin:0}
.bd{display:inline-block;padding:5px 13px;border-radius:999px;background:var(--acs);color:var(--ac);font-weight:600;font-size:13px;white-space:nowrap}
.sk em{font-style:normal;color:var(--mu);font-size:13px;margin-top:-6px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--ln)}
.me span{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc{width:100%;max-width:400px;background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:38px 30px;box-shadow:var(--shl);display:flex;flex-direction:column;align-items:center;gap:14px}
.lc .mk{width:54px;height:54px;border-radius:16px;font-size:16px}
.lc .b{width:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(700px 400px at 100% -5%,var(--acs),transparent 60%),radial-gradient(600px 400px at -10% 105%,rgba(14,165,233,.09),transparent 60%)}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28),rgba(255,255,255,0) 65%);animation:flt 9s ease-in-out infinite}
@keyframes flt{50%{transform:translate(-24px,20px) scale(1.06)}}
.sk{position:relative;overflow:hidden}
.sk::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c,var(--ac)),transparent)}
.grid .sk,.stats .stat,.duo .card{animation:fade .5s cubic-bezier(.2,.7,.2,1) both}
.grid .sk:nth-child(2),.stats .stat:nth-child(2),.duo .card:nth-child(2){animation-delay:.07s}
.grid .sk:nth-child(3),.stats .stat:nth-child(3){animation-delay:.14s}
.grid .sk:nth-child(4),.grid .sk:nth-child(5){animation-delay:.21s}
.nv.on .ni{filter:drop-shadow(0 4px 8px var(--acs))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:24px;box-shadow:var(--sh);display:block;width:100%;text-align:left;font:inherit;color:inherit}
.ctr{text-align:center}.card.ctr .score{margin-top:0}
button.card{cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
button.card:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:var(--shl)}
.duo{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
.wod{background:linear-gradient(135deg,var(--acs),transparent 70%),var(--sf)}
.wod em{font-style:italic;color:var(--mu);font-size:14px}
.fw{font-family:var(--ser);font-size:50px;line-height:1.1;letter-spacing:-.01em}.fw.sm{font-size:34px}
.tb{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tb big{font-family:var(--ser);font-size:64px;line-height:1;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tb span{color:var(--mu);font-size:14px}
.pb{display:block;height:8px;background:var(--sf2);border-radius:8px;overflow:hidden;margin-bottom:8px}
.pb u{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px;transition:width .8s}
.tgt small{color:var(--mu)}
.tabs{display:flex;gap:8px;margin:26px 0 18px}
.b.g{background:var(--sf);color:var(--ink);border-color:var(--ln)}.b.g:hover{border-color:var(--ac)}
.b.danger{color:var(--no);border-color:color-mix(in srgb,var(--no) 40%,transparent)}.b.danger:hover{border-color:var(--no)}
.fc{perspective:1200px;max-width:540px;margin:0 auto 20px;cursor:pointer}
.fi{position:relative;height:300px;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.fl .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;border:1px solid var(--ln);background:var(--sf);box-shadow:var(--shl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center}
.ff.bk{transform:rotateY(180deg);background:linear-gradient(135deg,#312e81,#4f46e5 70%,#7c3aed);color:#fff;border:0}
.ff small{text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--ac);font-size:11px}.ff.bk small{color:rgba(255,255,255,.7)}
.ff p{margin:0;opacity:.88;font-style:italic;max-width:38ch}
.hint{color:var(--mu);font-size:13px}
.fa{display:flex;gap:12px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.ch{display:block;width:100%;text-align:left;padding:13px 16px;margin:8px 0;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;transition:all .12s}
.ch:hover:not([disabled]){border-color:var(--ac);background:var(--acs)}.ch[disabled]{cursor:default}
.ch.ok{border-color:var(--ok);background:rgba(16,185,129,.12);font-weight:600}

.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}

.bdc b{font-size:15px;color:var(--mu)}.bdc small{color:var(--mu);font-size:12.5px;line-height:1.35}
.bdc.on{border-color:var(--gold)}.bdc.on span{filter:none;opacity:1}.bdc.on b{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:120;background:var(--cob);color:#fff;border:1px solid var(--gold);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}

.sbr{padding:12px 0;border-top:1px solid var(--ln)}.sbh{display:flex;justify-content:space-between;align-items:baseline}
.sbh b{font-size:17px}.sbh span{font-family:var(--ser);font-size:30px;font-weight:700;color:var(--ac)}

@media(max-width:600px){

 .pbar{display:none}
 .ft{padding:6px 8px;gap:6px}
 .ft .b{padding:8px 14px!important}
}

P1("Coral Reefs",[
"Coral reefs cover less than one per cent of the ocean floor, yet they are home to about a quarter of all marine species. For this reason, scientists often call them the rainforests of the sea. Reefs shelter an extraordinary range of animals, from tiny shrimps to large turtles and sharks. Many species spend only part of their lives on the reef, using the shelter of the corals when they are young and moving elsewhere as they grow. Scientists have identified thousands of kinds of fish on some reefs, and new species are still being discovered. This variety is one of the reasons why reefs attract so much attention from researchers.",
"Reefs are built by tiny animals called coral polyps. Each polyp produces a hard skeleton of limestone, and over thousands of years these skeletons form huge structures. The Great Barrier Reef in Australia is the largest, stretching for more than two thousand kilometres. It can even be seen from space. Growth is extremely slow, usually only a few centimetres a year, so a large reef represents a very long period of time. Different kinds of coral have different shapes, including branches, plates and rounded masses, and the combination of forms gives a reef many small hiding places. Divers who visit well-known sites often say that they are surprised by how many colours and shapes can be found in a single area.",
"Corals live in partnership with tiny algae. The algae live inside the coral and produce food from sunlight, and in return the coral gives them protection. The algae also give corals their bright colours. Because the algae need light, reefs usually grow in clear, shallow water. Scientists call this kind of relationship a partnership between two species, and it is one of the best-known examples in nature. The coral also catches small floating animals with its tentacles, mostly at night, which gives it extra nutrients. Because the whole system is delicate, even small changes in the surroundings can affect it, and researchers monitor reefs closely to see how they respond to new conditions.",
"Reefs are important to people as well. They protect coasts from storms by reducing the power of waves, and they provide food and jobs for millions of people who depend on fishing and tourism. Medicines for some illnesses have also been developed from reef animals. In many island countries, reefs are a main attraction for visitors, who come to swim, dive and photograph marine life. Local guides, boat owners and hotel staff all depend on healthy reefs for their income. Communities in these regions often have traditional rules about when and where fishing is permitted, which help to keep the reef productive for future generations.",
"Unfortunately, reefs are under threat. When the sea becomes too warm, corals push out their algae and turn white, a process known as bleaching. Bleached corals can recover if the water cools quickly, but many die. Pollution, overfishing and damage from boats are also causing harm. Scientists are now growing young corals in nurseries and planting them on damaged reefs, and some tourist areas have introduced rules to limit the number of divers. Other dangers include pollution from farms and towns, which can flow into the sea and encourage the growth of unwanted plants. Damaging fishing methods and careless anchoring can also break the fragile structures. Governments in several countries have created protected areas where such activities are controlled, and volunteers have helped to clean beaches and clear waste from the water. Experts agree that protecting reefs requires action at local and global levels."],

P2("The Rise of Online Shopping",[
"The first online purchase is often said to have taken place in 1994, when a man in the United States bought a music CD over the internet. Within a few years, companies such as Amazon and eBay had been founded, and millions of people had begun to try buying books and other goods from their computers. At that time, only a small minority of homes had internet access, and many people were unsure whether it was safe to give their payment details to a website. Early sites were slow and often difficult to use, but they showed that the idea could work. As connections improved and more households bought computers, the number of customers grew steadily, and retailers began to take the new market seriously.",
"Online shopping grew quickly because it offered clear advantages. Shoppers could compare prices in minutes, read reviews from other customers and have goods delivered to their door. People living far from big cities, who previously had little choice, could now buy almost anything. Customers also liked being able to shop at any hour of the day, without queues or opening times. Special offers sent by email encouraged them to return to the same site, and websites began to suggest products based on previous choices. For busy families, the convenience of ordering a week's supplies in a few minutes was often more important than the lower price, and many said that they would not return to the old routine.",
"Smartphones changed shopping again. By 2020, more than half of all online purchases in many countries were made on a phone. Shops began to design their websites for small screens, and new payment methods, such as paying with a fingerprint, made buying faster and easier. Shoppers use their phones even when they are in a store, for example to scan a code and compare the price with that of a website. Social media platforms have also become places where people discover new products, because friends and well-known personalities share what they have bought. Companies have responded by creating short videos and advertisements designed to be viewed on a small screen, often with a link that allows an instant purchase.",
"Traditional shops have suffered. Many high-street stores have closed, especially those selling books, music and clothes. Some shops have survived by offering something the internet cannot, such as expert advice or a pleasant place to meet friends. Others have started selling online themselves. Rents in popular shopping streets are often high, and many owners found that they could not compete with online companies that did not need such expensive premises. Local councils have tried to support town centres by organising markets, reducing parking costs and encouraging new businesses to move into empty buildings. Some towns have changed the purpose of old shops, turning them into homes, offices or community spaces.",
"Not everyone is happy about the change. Delivery vans cause traffic and pollution, and packaging creates a great deal of waste. In addition, many people return items they have bought online, and these returns are often thrown away. Some companies now encourage customers to collect parcels from local shops, which reduces the number of journeys. Environmental groups have called on companies to use less plastic and to deliver several items together in the same journey. Some firms have responded by switching to cardboard, and others offer electric vehicles for local deliveries. Customers can also help, by choosing slower delivery and by buying only what they need. Researchers note that the total effect of online shopping on the environment depends on how and where people choose to use it."],

P3("The Benefits of Volunteering",[
"Every year, millions of people give their time to help others without being paid. Volunteers work in hospitals, schools, animal shelters and environmental projects, and many charities could not exist without them. In some countries, as much as a third of the adult population volunteers at least once a year. Volunteering takes many forms. Some people give a few hours a week to the same organisation for years, while others prefer to help only when a particular need arises, such as after a flood or during a large public event. Retired people, students and employees on leave all take part, and many organisations rely on a wide range of ages and backgrounds to provide the skills they need.",
"The benefits for the people who receive help are easy to see, but volunteering also benefits the volunteers themselves. Research from several universities has found that volunteers tend to be happier and to have lower stress than people who do not volunteer. This may be because helping others gives a sense of purpose and creates friendships. Several studies describe how volunteers feel a sense of purpose and belonging, and some report lower levels of stress. Meeting new people is another advantage, particularly for those who have recently moved to an area or who live alone. Many volunteers say that they gain a different view of their own community, and that they become more aware of problems that they had not noticed before.",
"Volunteering can also improve career prospects. Young people who have volunteered often find it easier to get their first job, as employers see experience as a sign of responsibility. Volunteers can practise skills such as teamwork, organisation and communication, which are difficult to learn from books. Some universities give students credit for community work, and many employers ask about voluntary activities during interviews. People who have been out of work for some time can use volunteering to rebuild their confidence and keep in touch with the world of work. Those who change careers may also use it to test a new field before committing to it, and many find that it opens doors to paid positions.",
"However, volunteering is not without problems. Some people give up because the tasks are boring or because the organisation does not use their skills well. Charities have found that volunteers stay longer when they receive training, thanks and clear information about the difference they are making. Good organisations plan their programmes carefully, matching each volunteer to a role that suits their interests and abilities. They also provide a named person to whom volunteers can turn with questions, which helps newcomers to feel welcome. Where such support is missing, people may feel that their time is being wasted, and they are less likely to return. Charities say that a little attention to these details can make a great difference.",
"There is also debate about unpaid work. A few economists argue that charities should employ paid workers for important tasks, because volunteers may leave at any time. Supporters of volunteering reply that the two kinds of workers do different jobs and that volunteers bring energy and fresh ideas that paid staff sometimes lack. Others point out that volunteers and paid workers can complement one another, with volunteers taking on tasks that would not otherwise be done. The question is not only financial, since it also concerns fairness and the nature of the relationship between workers and the organisations that rely on them. Public discussion of the issue has increased in recent years, and several countries have introduced guidelines to make the roles of the two groups clearer."],

P1("The Origins of the Mechanical Clock",[
"For most of history, people told the time by watching the sun. Sundials were used in ancient Egypt and Greece, but they were useless at night or on cloudy days. Water clocks, which measured time by the steady flow of water from one container to another, solved this problem and were used in many ancient civilisations, although their accuracy depended on the temperature, which affected how fast the water moved. Other methods were also tried over the centuries, including candles marked with lines and vessels from which water escaped at a steady rate. Such devices were useful indoors but were rarely precise, and they needed constant attention from the people who used them. For ordinary farmers and travellers, the position of the sun and the length of shadows remained the most dependable guide to the hour.",
"The first mechanical clocks appeared in European monasteries in the late thirteenth century. Monks needed to pray at fixed times through the day and night, and a machine that could ring a bell at the right moment was extremely useful. These early clocks had no faces or hands. Their only purpose was to strike the hours, and the word 'clock' itself comes from an old word for 'bell'. These early machines had no faces or hands, and their purpose was to ring bells that would remind the community when it was time for a particular task. They were large, heavy and made by hand, and they often lost or gained a considerable amount of time each day. Skilled craftsmen were needed to build and maintain them, and the knowledge was usually passed from one generation to the next.",
"The heart of a mechanical clock is the escapement, a device that releases the energy of a falling weight in small, regular steps. Nobody knows who invented it, which is surprising given its importance. Early clocks were large, heavy and inaccurate, often losing or gaining up to an hour a day, and they had to be adjusted constantly by comparing them with a sundial. The idea was simple but required great skill to carry out, since the parts had to be made accurately and fitted together with very little space between them. Improvements to the mechanism were made gradually, and many clockmakers kept their methods secret from rivals. Historians have found it difficult to follow the development of the device because few written records have survived from the period.",
"During the fourteenth century, towns began to install public clocks in their main squares. These became symbols of civic pride, and some were decorated with moving figures and astronomical dials. Their effects on daily life were considerable. Markets opened and closed at fixed hours, and workers were paid by the hour instead of by the task, which changed the way people thought about time. Citizens gathered to watch the figures that appeared on the hour, and merchants used the bells to mark the opening and closing of markets. Rival towns competed to build the grandest clock, and visitors often travelled some distance to see the most famous examples. The arrival of public timekeeping slowly changed the way people organised their days, since work and trade could now follow a regular schedule.",
"The next great advance came in 1656, when the Dutch scientist Christiaan Huygens built the first pendulum clock, an idea suggested earlier by Galileo. The pendulum swings at a constant rate, which made clocks far more accurate, reducing errors to about a minute a day. Over the next century, further improvements made it possible for clocks to lose only a few seconds a week. Today, the most precise clocks are atomic clocks, which count the vibrations of atoms and would lose less than a second in millions of years. The new design was far more accurate than anything before it, and the best examples lost only a few seconds each day. Craftsmen across Europe began to make smaller clocks for private homes, and over time the price fell so that more families could afford one. These changes had wide effects on science and navigation, since reliable measurement of time became a basic tool for researchers and for people who travelled long distances."],

P2("Urban Farming",[
"By 2050, it is estimated that two thirds of the world's population will live in cities. This growth puts pressure on the food supply, since most of what urban residents eat is grown hundreds of kilometres away and must be transported by lorry, ship or aeroplane. Urban farming, the growing of food inside cities, has emerged as one possible response to this challenge. Transporting food from distant farms requires fuel and storage, and a large part of it may be lost on the way. City planners have therefore become interested in producing food closer to where people live. The idea is not new, since many cities in the past had gardens within their walls, but modern technology has created possibilities that earlier generations could not have imagined.",
"Urban farms take many forms. Some are small community gardens on empty land, while others are high-tech operations inside warehouses. In 'vertical farms', crops are grown in stacked trays under artificial light, with water and nutrients delivered directly to their roots. This method uses up to ninety-five per cent less water than traditional farming and can produce food all year round, regardless of weather. Roof gardens on office buildings and schools are becoming more common, and some restaurants grow herbs and salad leaves on their own terraces. Specialists have designed systems in which plants grow in water containing nutrients, rather than in soil, which allows them to be placed in small spaces. The cost of setting up each system varies widely, and success usually depends on careful management.",
"The most obvious benefit is freshness. Vegetables picked a few hours before sale taste better and contain more vitamins than those that have spent days in transit. Reducing transport also cuts carbon emissions. In addition, rooftop gardens help to cool buildings in summer and absorb rainwater, which reduces the risk of floods. Local production can also provide jobs and training, particularly in areas where employment is hard to find. In addition, green spaces help to cool buildings in summer, absorb rainwater and provide a home for insects and birds. Supporters say that these benefits are often overlooked when people calculate the value of an urban farm, since they focus mainly on the amount of food that is produced.",
"However, urban farming faces serious obstacles. Land in city centres is expensive, and vertical farms consume large amounts of electricity to power their lights, which can offset their environmental gains if the power comes from fossil fuels. Furthermore, most urban farms grow only leafy greens and herbs; staple foods such as wheat and rice need far more space than a city can offer. Another difficulty is the need for skilled workers, since growing crops in an unusual setting requires technical knowledge that is not widely available. Several companies that started with great enthusiasm have closed after failing to cover their costs. Observers say that the businesses most likely to survive are those that concentrate on high-value products and that sell directly to nearby customers.",
"Even so, many experts regard urban farming as valuable for reasons beyond food production. Community gardens bring neighbours together, teach children where food comes from and provide fresh produce in areas where supermarkets are scarce. Cities such as Singapore have set targets to produce a third of their food locally by 2030, showing that the idea is being taken seriously by governments. Schools that have created gardens report that pupils become more curious about where their meals come from, and many cities now include food growing in their long-term plans. Experts caution that urban farms are unlikely to feed entire cities, but they believe that they can contribute to a more varied and resilient food system. The idea continues to attract attention from planners, scientists and ordinary residents."],

P3("The Psychology of Colour",[
"Colour is all around us, and many people believe that it can influence the way we feel and behave. Red is said to make us excited, blue to make us calm, and yellow to make us cheerful. But how much of this is supported by scientific evidence? Everyday expressions reflect this belief, as people speak of feeling blue or seeing red. Interior designers choose paint with care, and hospitals and schools often select colours that are thought to create a calm atmosphere. Yet scientists point out that such associations are often based on custom and personal experience, and it is difficult to separate them from the effect of colour itself.",
"Some of the best-known research comes from the field of marketing. Companies spend large sums choosing the colours of their logos and packaging, believing that these shape how customers see their products. A study of well-known brands found that the same few colours appear again and again: blue is often chosen by banks and technology firms to suggest trust, while green is linked to health and nature. Researchers have asked shoppers to describe their impressions of brands that use different colours, and they have found that people often link certain colours with certain qualities. However, the results are not always consistent, and they may depend on the product, the country and the age of the people who are asked. Several scholars argue that the match between a colour and a product matters more than the colour alone.",
"In sport, some researchers have claimed that colour may affect results. A well-known analysis of Olympic combat sports found that athletes wearing red won slightly more often than those wearing blue. The authors suggested that red may signal dominance, or make opponents feel threatened. Others, however, pointed out that the sample was small and that the referees may have been influenced rather than the competitors. Other studies have examined football and other team games, with mixed results. Critics note that many such analyses rely on a small number of events and that it is difficult to exclude other explanations, such as differences in the skill of the competitors. For this reason, many scientists treat the claims about sport with caution and say that more careful experiments are needed.",
"Perhaps the most reliable findings concern the effect of colour on performance in mental tasks. In several experiments, students who saw the colour red before an examination performed worse than those who saw green or grey. The researchers believe that red is associated with danger and failure, which may produce anxiety. Yet attempts to repeat these experiments have sometimes failed to produce the same results, so the effect remains uncertain. Even in these cases, the effects are generally small and may last only a short time. Researchers are also uncertain about the reasons, and some suggest that the results may be linked to the way in which people have learned to connect colours with warnings or success. Further work is under way in several laboratories, and the authors of these studies stress that their conclusions are provisional.",
"It is also important to remember that colour meanings differ between cultures. In many Western countries white is worn at weddings, whereas in parts of Asia it is associated with mourning. Even within one culture, personal experience matters: a person who had a bad time at a hospital with green walls may dislike green for life. Overall, most psychologists agree that colour does influence us, but the effects are usually small and depend heavily on context. Claims that a particular shade can transform mood or behaviour should be treated with caution. Colour names also vary, and some languages divide the spectrum differently from English. A shade that seems pleasant in one place may carry a different meaning somewhere else, which can cause difficulties for international companies. Designers who work for global markets therefore often test their ideas with local audiences before launching a product, and they avoid assuming that one set of associations applies everywhere."],
true,

P1("Glass: From Sand to Skyscraper",[
"Glass is one of humanity's oldest manufactured materials, yet we rarely think about it. The earliest glass objects, small beads, were made in Mesopotamia around 3500 BC, probably by accident when sand was heated with natural soda. Because the material was rare and difficult to produce, glass was a luxury for wealthy people for centuries. Glass can occur naturally, for example when lightning strikes sand or when volcanoes produce a smooth black material, and early people used these natural forms to make tools and ornaments. Making glass deliberately required much higher temperatures than other early crafts, and workshops were therefore built close to supplies of fuel. The finished objects were rare and valuable, and they were often traded over long distances.",
"A major breakthrough came around 50 BC, when glassmakers in the Roman Empire discovered glassblowing. By blowing air through a tube into a lump of molten glass, a worker could produce a hollow shape in seconds. This made bottles and drinking vessels cheap enough for ordinary people, and glass spread across the empire. The new technique made it possible to produce hollow containers quickly and cheaply, and glass became part of everyday life instead of a luxury for rulers. Workshops were set up across the empire, and merchants used glass vessels to store and transport oils, wine and perfumes. The skill spread widely, and its influence can still be seen in the shapes of many modern bottles and jars.",
"In the thirteenth century, the city of Venice became the centre of European glassmaking. The authorities were so worried about fires that in 1291 they ordered all glassmakers to move to the island of Murano. They were also afraid of losing their trade secrets, and for this reason the glassmakers were not normally allowed to leave the republic. Venetian glass, famous for its clarity and colour, was exported all over the continent. Glassmakers enjoyed special privileges and a high social position, but they were also closely watched. Techniques were guarded as trade secrets, and those who tried to share them with foreigners could be punished severely. The city's glass was admired across the continent, and the craft became a major source of income and pride for generations of local families.",
"For windows, glass remained expensive until the nineteenth century, because large flat sheets were hard to make. In 1959, the British engineer Alastair Pilkington invented the float glass process, in which molten glass is poured onto a bed of liquid tin, producing a perfectly flat sheet. This method is still used for nearly all windows today and made possible the glass-covered skyscrapers of modern cities. Until then, most ordinary homes had small windows with thick, uneven panes, or used wooden shutters to keep out the weather. Larger panes gradually became available as manufacturing improved, and cities began to fill with shop fronts and greenhouses made of glass. The material also changed the design of public buildings, since architects could now bring daylight into spaces that had previously been dark.",
"Glass has a remarkable property in that it can be recycled again and again without losing quality. Making a new bottle from recycled glass uses about thirty per cent less energy than making one from raw materials. Even so, in some countries fewer than a third of glass bottles are recycled, and the rest end up in landfill, where they take thousands of years to break down. Collection schemes in many countries encourage households to sort their glass into separate containers, and bottle banks have become a familiar sight in towns. Recycling also reduces the amount of material sent to landfill sites. Experts note that the process works best when different colours are kept apart, since mixed batches can be harder to use, and that people can reduce waste further by reusing bottles and jars at home."],

P2("The Return of the Wolf to Yellowstone",[
"By the 1920s, wolves had been hunted to extinction in Yellowstone National Park, the oldest national park in the United States. At the time, they were regarded as dangerous pests, and park managers believed that removing them would protect deer and elk, the animals that visitors most enjoyed seeing. Hunting had been encouraged for many years, and the government paid rewards for animals that were killed. People at the time generally saw wolves as a danger to farm animals and to the species that visitors came to see. Few thought that removing a large predator might have wider consequences, and the idea that every living thing has a part to play in nature was not yet widely accepted.",
"The effects of this decision gradually became clear. Without predators, the number of elk grew rapidly, and the animals ate young trees such as willows and aspens in huge quantities. Beavers, which depend on willows for food and building material, almost disappeared, and with them the ponds that supported fish, frogs and birds. Biologists who studied the park in the following years noticed that some areas looked quite different from the way they had in earlier photographs. Birds and small animals that depended on the young trees became less common, and the banks of streams were damaged where the ground was bare. These changes took many years to appear, which is one reason why the connection with the loss of the wolves was not understood at first.",
"In 1995 and 1996, thirty-one wolves were captured in Canada and released in the park. Scientists monitored them closely and were surprised by how fast the ecosystem responded. Elk began to avoid open valleys and river banks where they were easiest to hunt, allowing young trees to grow again within a few years. The release was preceded by many years of discussion, and it was strongly opposed by some local people who feared for their animals. Supporters argued that the park was large enough for the wolves to live without harming nearby farms. Officials arranged public meetings and prepared a detailed plan, and visitors to the park soon began to arrive in large numbers in the hope of seeing the returning animals.",
"Some researchers claim that the wolves triggered a 'trophic cascade', a chain reaction that affected the whole ecosystem, including the course of rivers. Others are more cautious. They point out that other factors, such as drought and the hunting of elk by humans and bears, also reduced elk numbers, and that it is difficult to prove how much of the recovery is due to wolves alone. Other scientists are more cautious, pointing out that many changes happened at the same time, including shifts in the weather and in the numbers of other animals. They say that it is difficult to prove which factor was most important and that the effects of one species rarely work in a simple chain. The debate has encouraged new research, and teams continue to collect data in the park every year.",
"The debate has not stopped ranchers outside the park from worrying about their livestock, and wolves that leave Yellowstone can be legally shot in some states. Nevertheless, the project is widely seen as proof that restoring a missing predator can bring a damaged landscape back to life, and similar programmes are being planned in Europe. Park managers say that the number of wolves is carefully counted and that compensation is offered to farmers whose animals are killed. Some ranchers have tried measures such as night shelters and guard dogs, which are said to reduce losses. The disagreement is a reminder that decisions about wildlife involve social and economic questions as well as scientific ones, and it is likely to continue for many years."],

P3("How Cities Handle Noise",[
"Noise is among the most widespread forms of urban pollution, yet for a long time it received much less attention than dirty air or water. In recent years, however, growing evidence has shown that constant loud sound is not merely annoying but can seriously harm health. The World Health Organization estimates that in Western Europe, noise from traffic alone causes the loss of over a million healthy years of life every year. Unlike smoke or waste, noise leaves no visible trace, which may be one reason why it was neglected for so long. It is also difficult to measure, because the same sound may seem pleasant to one person and unbearable to another. Scientists now use special instruments and surveys to map levels of sound across cities, and the results are being used to help plan new roads and housing.",
"Long-term exposure to noise has been linked to high blood pressure, heart disease and poor sleep. Children who attend schools near airports have been found to read less well than those in quieter areas. Researchers believe that the body reacts to loud sounds as a sign of danger, even during sleep, releasing stress hormones that wear it down over time. Researchers say that the effects can be gradual, and that many people do not notice the damage until it has already occurred. Some studies suggest that noise at night is particularly harmful, since it can interrupt rest even when the sleeper does not wake. Health organisations have published guidelines for acceptable levels, but these are not always followed, and many city residents live in areas that exceed them.",
"Cities have tried many solutions. The most obvious is to reduce the noise at its source. Many cities now require quieter road surfaces, and electric vehicles, which make little noise at low speeds, are helping. Some airports have banned the loudest aircraft or prohibit night flights completely, although airlines complain that this raises their costs. Rules about vehicles are often easier to apply than rules about other sources of noise, since the numbers of cars and lorries can be counted and tested. Builders may also be required to limit the hours at which noisy work takes place. Planners say that a combination of measures usually works better than a single one, and that results depend on how strictly the regulations are enforced.",
"A second approach is to block the sound. Walls along motorways can reduce noise by up to ten decibels, which the human ear perceives as roughly halving the loudness. Unfortunately, such barriers are expensive and unattractive, and they only protect the people who live directly behind them. Planting trees and shrubs is sometimes suggested as an additional measure, although experts say that their main benefit is to make the surroundings look more attractive rather than to cut noise. Windows with several layers of glass can also help, and some authorities pay part of the cost for homes close to busy roads. Such solutions can be expensive, and they cannot always be used in older buildings.",
"A third approach is more creative: improving how people experience sound. In several cities, designers have added fountains to squares, because the sound of running water hides traffic noise, and studies show that people find the water sound pleasant. Some planners go further and create 'quiet areas', parks where noise limits are strictly enforced. The most effective strategy is probably a combination of all three. As cities grow, planning for sound from the start, rather than correcting problems afterwards, will be essential. Researchers have also experimented with recordings of natural sounds, which are played in public places to mask the noise of traffic. Early results show that people often report feeling more relaxed, although the effect may depend on how loud the original noise is. Supporters say that such approaches are inexpensive and flexible, while critics argue that they must not replace efforts to reduce the noise at its source."],

P1("The Mystery of Roman Concrete",[
"Visitors to Rome can still walk into the Pantheon, a building completed around 126 AD whose dome remains the largest unreinforced concrete dome in the world. Two thousand years after its construction, it stands undamaged by earthquakes and floods that have destroyed many younger buildings. By contrast, modern concrete structures, built with the most advanced technology, often begin to crumble after fifty to a hundred years. This contrast has long puzzled engineers. Engineers who study the building say that its survival is all the more remarkable because it has been exposed to rain, pollution and changes in temperature for many centuries. Modern structures made of similar materials often show signs of wear within a few decades. For this reason, the ancient buildings have become an important subject for researchers who hope to design more durable materials.",
"The Roman writer Vitruvius, in the first century BC, described a mixture of lime, volcanic ash and rock fragments. The ash, called pozzolana, came from the area around Naples, and the Romans valued it so much that they shipped it across the Mediterranean to construction sites. It was long assumed that the ash was the key to the material's durability, because it reacts chemically with lime and water to produce a hard, stable compound. His account was written as a practical guide for builders, and it was copied and studied for many centuries. Later scholars were impressed by the care with which the Romans selected their materials, and they assumed that the quality of the ingredients was the main reason for the strength of the finished work. Yet the description left out many details about how the mixture was prepared, and these gaps have encouraged debate.",
"That explanation was challenged in 2023, when a team led by Admir Masic at the Massachusetts Institute of Technology analysed samples from a Roman city wall near Rome. Inside the concrete they found small white lumps of lime, known as lime clasts, which earlier researchers had dismissed as evidence of poor mixing or low-quality materials. Masic's team suggested that the clasts were not a flaw at all. The discovery was unexpected, since such lumps had generally been treated as signs of careless mixing or poor quality materials. The scientists examined them using several techniques, including microscopes and chemical analysis, to understand how they had formed. Their findings suggested that the lumps might serve a purpose, an idea that attracted widespread attention from the press as well as from specialists in the field.",
"The researchers proposed that the Romans used a technique called hot mixing, in which quicklime was added directly to the mixture rather than being combined with water beforehand. This produces a chemical reaction that generates considerable heat, and creates lumps of lime that remain reactive for years. If a crack forms in the concrete, water seeping in dissolves the lime clasts, and the calcium that is released fills the crack by hardening once more. In effect, the material is able to repair itself. Such a process would have required skill and experience, because the heat and the speed of the reaction needed to be controlled by workers on the building site. The authors suggest that it may also have shortened the time needed for the concrete to set, which would have allowed construction to proceed more quickly. These claims are based on laboratory work, and they remain under discussion among scientists in several countries.",
"To test this theory, the team made two batches of concrete, one using the Roman method and one using a modern formula, and deliberately cracked both. Water was then passed through the cracks. The modern sample remained cracked, but the cracks in the Roman-style concrete were completely sealed within two weeks. The findings, if confirmed, could be valuable for modern construction, where the production of cement is responsible for about eight per cent of global carbon dioxide emissions. The experiment was small, and the authors acknowledge that a laboratory test cannot reproduce all the conditions that a building experiences over two thousand years. Even so, it was presented as evidence that the lumps could help the material to repair itself. The researchers say that the next step is to test larger samples and to explore whether similar methods could be used in modern construction projects.",
"Not all scholars are convinced. Some archaeologists note that the Romans also built with other methods, and that the best-preserved structures may simply be those that were built in sheltered places or repaired by later generations. Others argue that the laboratory test took place over weeks, whereas the real self-healing happened over centuries, and that more evidence from ancient sites is still needed. Others say that the results, though interesting, do not yet show that the Romans deliberately chose this method. They point out that written evidence of the practice is missing, and that the interpretation of the lumps requires further study. The debate is a reminder that archaeological findings often allow more than one explanation, and that new techniques may continue to change what scholars believe about the past."],

P2("Cognitive Biases in Decision Making",[
"Human beings like to think of themselves as rational decision-makers, weighing evidence carefully before reaching a conclusion. Yet since the 1970s, when psychologists Daniel Kahneman and Amos Tversky began to publish their work, a large body of research has shown that our judgements are routinely distorted by mental shortcuts known as cognitive biases. These shortcuts evolved because they allow quick decisions with limited information, but in modern settings they can lead us badly astray. The popular image of the thoughtful decision-maker is deeply rooted in economics, law and everyday conversation. It suggests that mistakes arise mainly from lack of information or from strong emotion. The research that followed challenged this view by showing that errors can be systematic and predictable, even among intelligent and well-informed people, and that they often occur without the person being aware of them.",
"One of the best-documented is confirmation bias, the tendency to search for and favour information that supports what we already believe. In a classic experiment, participants who held strong views on capital punishment were shown two studies, one supporting and one opposing it. Both groups rated the study that agreed with them as more convincing, and, remarkably, left the experiment with their opinions even more firmly entrenched than before. The tendency appears in many settings, from the way in which people read the news to the way in which managers assess the performance of employees. Researchers note that it can be difficult to detect in oneself, because the process of selecting and interpreting information feels natural. Some have suggested that it may be strengthened by modern media, which make it easy to find sources that agree with one's existing opinions.",
"Anchoring is a second distortion. When asked to estimate an unknown quantity, people are strongly influenced by any number mentioned earlier, even one that is plainly irrelevant. In one study, participants who had spun a rigged wheel that stopped at a high number then gave higher estimates of the percentage of African countries in the United Nations than those who had seen a low number. Negotiators and salespeople exploit the effect by naming a high price first. Experts in negotiation are well aware of this effect, and they often advise people to make the first offer, since it may influence the discussion that follows. The effect has also been observed in professional judgements, for example in the sums awarded in legal cases. Researchers believe that the same mechanism may operate in everyday decisions, such as choosing how much to spend or how long a task will take.",
"A third is loss aversion: the pain of losing something is felt roughly twice as strongly as the pleasure of gaining the same thing. This helps to explain why investors often hold on to falling shares, hoping to avoid admitting a loss, while selling profitable ones too early. It also explains why people are more motivated by the threat of a penalty than by the promise of an equivalent reward. The idea has been applied in fields as varied as marketing, health and public policy. Retailers, for example, may present a price reduction as a loss that the customer will suffer if the offer is missed. Some economists have questioned how widely the pattern applies, and they note that the strength of the effect may differ between individuals and between cultures, depending on the circumstances.",
"Can biases be overcome? Kahneman himself was pessimistic, admitting that, despite decades of study, he remained as prone to them as anyone. Other researchers are more hopeful. Training programmes that teach people to consider opposing evidence have produced modest improvements, and organisations that use checklists and require decisions to be reviewed by independent colleagues appear to make fewer errors. The most effective remedy, it seems, is not individual effort but better systems. Even if the biases cannot be removed entirely, organisations may be able to reduce their consequences by changing the way that decisions are made, for instance by requiring a second opinion or by using checklists. Researchers stress that such measures need to be adapted to the context and tested carefully. The question of how far training transfers from the classroom to real situations remains the subject of active research."],

P3("Rewilding Europe",[
"Rewilding is the practice of restoring ecosystems by reintroducing species that have been lost and then stepping back to allow natural processes to resume. Unlike traditional conservation, which often seeks to preserve a landscape in a fixed condition, rewilding accepts change, and even unpredictability, as part of a healthy system. The idea has gained momentum in Europe, where the abandonment of farmland has opened up large areas of land. The term became widely used in the early years of this century, and it has since been applied to projects of very different sizes, from small nature reserves to areas of thousands of square kilometres. Supporters describe it as a hopeful approach, since it emphasises recovery rather than loss. Nonetheless, there is no single agreed definition, and organisations often use the word in slightly different ways.",
"Since the 1950s, millions of people have moved from villages to cities across eastern and southern Europe, leaving behind fields and pastures that no longer pay. Forest has expanded naturally into these areas, and with it have come wolves, lynx and bears, whose populations have increased in several countries after decades of decline. Bison, once extinct in the wild, now roam the forests of Poland and Romania after reintroduction. As a result, large areas of countryside have become sparsely populated, and many villages have only a few elderly inhabitants. Land that was once farmed intensively has been abandoned, creating opportunities that conservation organisations have been quick to recognise. Local governments, however, are often concerned about the loss of services and the effect on the rural economy, and they do not always welcome plans that seem to put wildlife before people.",
"Supporters of rewilding argue that the benefits go beyond wildlife. Large grazing animals open up woodland and encourage a variety of plants and insects. Wetlands restored on river flood plains absorb floodwater and store carbon, and tourism linked to wildlife can bring income to depopulated villages. A study in Romania estimated that visitors to rewilded areas spent more than the local economy had earned from farming the same land. Some projects have created new forms of employment, such as guiding visitors and running small businesses that provide accommodation and food. Advocates say that income from such activities can help to compensate for the decline in farming. They also point out that restored landscapes may be more resilient to droughts and fires, although scientists note that this depends on the particular area and the way in which it is managed.",
"Critics, however, raise several objections. Farmers fear the loss of livestock to predators and the damage caused by wild herbivores, and in practice compensation schemes are often slow and inadequate. Others see rewilding as a romantic idea that ignores the cultural value of traditional landscapes: the meadows of the Alps, for instance, are the product of centuries of grazing and many rare plants depend on them. If the grazing stops, forest returns and those plants disappear. Residents of areas affected by such projects sometimes feel that decisions have been made by outsiders who do not understand local conditions. Disagreements can last for years and may harm the relationship between conservation groups and communities. Project managers have therefore started to hold meetings with villagers at an early stage, and some now include local people in the planning and day-to-day management of their reserves.",
"There is also a philosophical objection. Critics point out that deciding what counts as 'wild' depends on choosing a past baseline, such as the landscape before humans arrived. Since ecosystems have always changed, the choice of date is arbitrary, and the species brought back may not suit current conditions, particularly given climate change. Defenders respond that rewilding does not aim to recreate the past but to restore the functions that species perform. Whatever the outcome, the debate has shifted attention from protecting nature in small reserves toward considering whole landscapes. The question has no simple answer, and philosophers and ecologists continue to argue about it. Some suggest that the aim should be to restore processes, such as grazing and flooding, rather than a particular list of species. Others reply that this is hard to measure and might make it difficult to judge whether a project has succeeded. The disagreement shows that rewilding raises questions about values as well as science."],

P1("Tulip Mania",[
"Tulips are so closely associated with the Netherlands that it is easy to forget that they originated in Central Asia and arrived in Europe only in the sixteenth century. They were brought from the Ottoman Empire, and soon became the most desirable of garden flowers. By the 1630s, a craze for tulips had developed in the Dutch Republic that has come to be known as 'tulip mania', often described as the first speculative bubble in history. Within a few decades, the flower had become a symbol of wealth and good taste among the educated classes. Gardens were designed to display rare varieties, and painters produced detailed pictures of them, many of which survive in museums today. The fashion for tulips reflected the prosperity of the country at the time, when trade with distant regions had brought large fortunes to merchants in the major cities.",
"The most prized tulips were those with striped or feathered petals. These patterns were caused, as botanists would later discover, by a virus carried by aphids, which also weakened the bulbs and made them slow to multiply. This explains why such bulbs were extremely scarce. A single bulb of the most famous variety, Semper Augustus, was reported to cost as much as a large house in Amsterdam. Growers could not predict which bulbs would produce the most admired patterns, and a single plant might lose its markings in later years. This uncertainty added to the excitement, since a particular bulb could be worth far more than another that looked almost identical. Collectors often named their favourites after famous people or military leaders, and the best examples were recorded in illustrated catalogues.",
"Traditionally, the story goes, ordinary people from all classes abandoned their jobs to trade in bulbs, and in the winter of 1636–37 prices soared to absurd heights before collapsing in February 1637, leaving thousands ruined. This version was popularised in the nineteenth century by the Scottish writer Charles Mackay, whose book on popular delusions was widely read and has been repeated ever since. The account was repeated in books and newspapers for centuries and became a standard warning about the dangers of speculation. Writers of the nineteenth century were especially fond of the story, and they used it to illustrate the supposed madness of crowds. Its dramatic details made it easy to remember, and it was often cited by commentators whenever prices in another market rose sharply.",
"Modern historians have questioned much of this account. Anne Goldgar, who examined surviving records of the period, found that only a small number of wealthy merchants and artists took part in the trade, and that no one is known to have been bankrupted by it. Moreover, many of the highest prices were recorded for contracts that were never fulfilled, since buyers in the trading taverns agreed on sums for bulbs that were still in the ground. Her work relied on records such as notarial documents, court cases and private letters, which gave a more detailed picture than the stories that had circulated afterwards. The research suggested that the economic damage was limited and that the market did not cause a national crisis. Not every scholar accepts these conclusions, but they have changed the way that the episode is described in many recent studies.",
"This does not mean the episode was meaningless. In the winter, bulbs could not be handed over, and traders used contracts for future delivery, an early form of futures trading. When the market fell, buyers refused to honour their agreements, and the courts declined to enforce them, treating them as gambling debts. The loss of trust, rather than the loss of money, may have been the lasting damage. Why, then, has the story endured? One reason may be that it offers a simple moral about greed, one that is repeatedly applied to modern bubbles. Some economists regard the story as an early illustration of how new financial instruments can create both opportunities and risks. Others argue that the focus on the apparent foolishness of buyers overlooks the practical difficulties of a market in which the product could not be seen or delivered. The debate shows how the interpretation of an event can change as historians discover new sources of evidence."],

P2("Dying Languages",[
"There are about seven thousand languages in the world today, but linguists predict that as many as half of them may disappear by the end of this century. Roughly one language dies every few weeks, usually when its last fluent speaker passes away. Most of these languages are spoken by small communities and have never been written down, so their loss leaves no record at all. Many of them are spoken by very few people, and a large share of the world's population uses only a small number of major languages. Linguists describe a language as endangered when children no longer learn it as their first language. Because many of these languages have never been written down, there may be no recordings of their sounds, vocabulary or stories once the last speakers have died.",
"Languages rarely die because their speakers are forbidden to use them, although this has happened. More often, the cause is economic. Parents move to cities in search of work, where a dominant language such as English, Spanish or Mandarin is needed, and they encourage their children to learn it instead. Within two or three generations the older language is used only by grandparents, and then by no one. Schools and workplaces may also play a role, since they often reward the use of the national language and treat other languages as unimportant. Young people sometimes come to feel that their grandparents' language is old-fashioned or of little practical value. Within a generation or two, families that once spoke the language every day may be able to say only a few words, and eventually the knowledge is lost entirely.",
"Why does this matter? Each language carries a unique store of knowledge accumulated over many centuries. Speakers of some Amazonian languages, for example, possess detailed names for medicinal plants that science has not yet studied. Linguists also argue that the diversity of languages is a window into the human mind, since it reveals how many different ways grammar can be organised. Linguists add that each language shows a different way of organising experience, for example in the ways that it describes time, family relationships or the natural world. Studying these differences helps researchers to understand how the human mind works. The loss of a language is therefore not only a loss for the speakers' community but also for science, and many scholars regard it as comparable to the loss of a species.",
"Some communities have fought back. In New Zealand, Māori was declared an official language in 1987, and 'language nests', preschools in which children are taught entirely in Māori, have helped to produce a new generation of speakers. Hawaiian has been revived in a similar way. Technology can also help: for example, apps and online dictionaries now exist for dozens of endangered languages, and some communities record elders on video. Similar projects exist in other parts of the world, including Wales, Hawaii and parts of Canada, where communities have developed their own methods of teaching. Programmes of this kind often depend on cooperation between older speakers, who keep the knowledge, and younger people, who are comfortable with new technology. Organisers say that success is not guaranteed, and that long-term support is needed if the results are to last.",
"Even so, revitalisation is difficult. It requires years of funding, trained teachers and, most importantly, the willingness of young people to use the language outside the classroom. Some linguists therefore argue that documenting a language, by recording stories and compiling dictionaries, is a more realistic goal than saving it. Others reply that a language preserved only in archives is no longer a living one. Few communities have the resources to meet all of these requirements, and many languages are spoken in remote regions where it is hard to find teachers. Some linguists warn that spending money on a hopeless case may take resources away from projects that have a better chance of success. Others reply that every attempt to save a language is valuable, because the process itself can strengthen a community's sense of identity."],
