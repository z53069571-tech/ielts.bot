P3("Deep-Sea Mining",[
"Scattered across vast areas of the deep ocean floor, at depths of four to six kilometres, lie potato-sized lumps of metal-rich rock known as polymetallic nodules. They contain nickel, cobalt, copper and manganese, minerals that are essential for the batteries used in electric vehicles and renewable energy systems. As demand for these metals grows, a number of companies have begun to look at the seabed as a new source. Their formation is slow, and they grow around a small core such as a shark's tooth or a fragment of shell. The metals they contain are widely used in batteries, which has increased the commercial interest in them as the demand for electric vehicles and storage systems rises. Companies argue that the nodules lie loose on the seabed and could therefore be collected with less disturbance than the mining of ore on land.",
"The area attracting the most attention is the Clarion-Clipperton Zone, a stretch of Pacific Ocean between Hawaii and Mexico, roughly the size of the continental United States. Estimates suggest that its nodules hold more nickel and manganese than all known land reserves combined. Advocates argue that deep-sea mining would reduce dependence on land mines, many of which are linked to deforestation and poor working conditions, particularly for cobalt in Central Africa. Several firms have developed prototype machines that are designed to move across the seabed and lift the nodules to a ship on the surface. Tests have been carried out in limited areas, and the results are being studied by independent researchers. The industry says that it is taking environmental concerns seriously, while critics reply that it is difficult to judge the effects of large-scale operations from small experiments.",
"Environmental scientists are alarmed. Nodules take millions of years to form, so they are effectively a non-renewable resource, and they provide the only hard surface on which many deep-sea creatures can live. In a 1989 experiment in the Pacific, researchers ploughed a small area of seabed, and when scientists returned more than thirty years later, they found that the tracks were still visible and animal life had not recovered. Collecting machines also create clouds of sediment that may travel hundreds of kilometres and bury animals in other areas. Mining machines would also stir up clouds of fine sediment, which could spread over long distances before settling again. Researchers are uncertain how far these plumes would travel and how animals on the seabed would respond to them. Surveys of areas that were disturbed decades ago have shown that recovery is slow, but the evidence comes from a small number of sites and may not apply everywhere.",
"Another difficulty is how little is known. Scientists estimate that more than ninety per cent of the species collected in the Clarion-Clipperton Zone are new to science. Without knowing what lives there, it is impossible to predict the damage mining might cause, and some researchers warn that species may become extinct before they have even been named. Deep-sea research is expensive and technically demanding, and only a small fraction of the ocean floor has been explored in detail. New expeditions regularly discover animals that have never been described, which makes it hard to assess what might be at risk. Some scientists therefore recommend that more research is completed before any commercial activity begins, while industry representatives argue that mining and research can progress at the same time.",
"The regulatory position is unsettled. Mining in international waters is governed by the International Seabed Authority, which has granted exploration contracts to more than thirty organisations but has not yet agreed a final set of rules for commercial extraction. In 2021, the small island nation of Nauru triggered a rule that obliges the authority to consider applications within two years, raising fears that mining could begin before adequate protections exist. Several countries, together with some major car and technology firms, have called for a pause. Several countries and companies have called for a pause, citing the lack of scientific data, while others argue that delay would increase dependence on mines on land, which also cause damage. Governments disagree about who should receive the income from minerals in international waters, and developing countries have asked for a fair share of any profits. The negotiations are likely to be long and complex, and the outcome remains uncertain."],

P1("Honeybees and the Food We Eat",[
"Honeybees are responsible for pollinating about one third of the crops that people eat, including apples, almonds and blueberries. In the United States alone, their work is worth an estimated fifteen billion dollars a year. For this reason, beekeepers were alarmed in 2006 when they began to report that whole colonies were disappearing. Almonds are a striking example: in California, growers rely so heavily on bees that hives are carried by lorry from across the country each February to pollinate the orchards. Without this seasonal movement of insects, harvests of many fruits, nuts and vegetables would be far smaller and more expensive for shoppers. Because beekeeping is a small industry compared with the farming it supports, many economists described the sudden losses as a threat out of proportion to the number of people directly involved. News of the problem spread quickly through farming communities and soon reached government agencies and universities.",
"The problem was named colony collapse disorder. Typically, worker bees left the hive and never returned, leaving the queen and a few young bees behind. Some beekeepers lost more than half of their hives in a single winter. Scientists have found no single cause, but they suspect a combination of pesticides, parasites and poor nutrition. Investigators who examined empty hives noticed that food stores and young bees were often still present, which made the cases unusual, since starving or diseased colonies normally leave dead bees inside. Laboratories in several countries began testing wax, pollen and dead insects for chemicals and disease. Their results were mixed: some samples contained traces of many different pesticides, while others showed no obvious signs of poisoning at all. Because the pattern varied from one region to another, researchers were reluctant to name a single culprit, and several large studies were set up to follow thousands of colonies over a number of years.",
"The most dangerous parasite is the varroa mite, which feeds on bees and spreads viruses between them. Colonies weakened by mites are less able to survive cold weather. Some farmers have switched to crops that need less pesticide, while others plant wildflowers near their fields to give bees a varied diet. Mites attach themselves to the bodies of bees, weakening them over time. Because the damage is gradual, an infestation can go unnoticed for months. Researchers have studied ways of detecting mites early, and some are working on methods of breeding bees that clean their nests more thoroughly. Good management also matters, and many experts say that careful monitoring is the first step in any control programme, since a problem that is found early is far easier to manage than one that has already spread widely.",
"Since 2010, the number of hives in the United States has stopped falling, mainly because beekeepers have bought replacement colonies. However, wild bees, which also pollinate crops, have continued to decline. Researchers say that protecting them will need action from both farmers and city planners. One approach is to plant hedgerows, orchards and flower strips that provide food throughout the spring and summer. Another is to reduce the mowing of road verges and parks. Several cities have begun to encourage residents to leave small areas of garden untidy, since wild flowers and bare soil give insects places to feed and nest. Researchers caution that none of these measures is a quick fix, but they add that the cost is low, and that the benefits extend to many other species as well."],

P2("The Rise of the Public Library",[
"Before the nineteenth century, books were expensive and most people could not read them. Libraries existed, but they belonged to universities, churches or wealthy individuals. Membership of 'subscription libraries' required a fee that only the middle classes could afford. Even those who could afford a fee often found the collections disappointing, because subscription libraries usually bought only the kinds of books their members wanted. Novels were frequently regarded with suspicion, and popular magazines were rarely stocked. Working people who wished to read had to rely on cheap printed sheets, on books passed from friend to friend, or on lessons at evening schools run by charities. Literacy was rising, but the supply of affordable reading material lagged far behind the demand.",
"The first tax-funded public library in Britain opened in 1850 after an Act of Parliament allowed towns to spend public money on them. Supporters argued that access to books would improve workers' morals and skills. Opponents complained that ordinary taxpayers should not pay for something they might never use. The debate in Parliament lasted several months. Reformers pointed to museums and parks, which were already paid for out of public funds, and asked why books should be treated differently. The Act at first allowed only a small tax, which meant that many early libraries were housed in borrowed rooms and had very few books. Nevertheless, several large industrial towns soon opened libraries that attracted thousands of readers within a few years, and the idea gradually won acceptance across the country.",
"In the United States, the steel businessman Andrew Carnegie financed more than 1,600 library buildings between 1883 and 1919. He insisted that each town provide the land and promise to pay for running costs, so that communities felt responsible for their libraries. Carnegie, who had left school at the age of thirteen and educated himself with borrowed books, believed that the best use of a fortune was to give people the chance to improve themselves. The buildings he paid for were often grand, with steps leading up to the door as a symbol of climbing towards knowledge. Critics noted that he gave money for buildings but not for books, which meant that many small libraries struggled to fill their shelves. Even so, the programme transformed access to reading in towns across the country.",
"Today, many libraries face budget cuts, and thousands have closed in recent years. Yet visitor numbers remain high. People use libraries for free internet access, help with job-hunting and children's activities, as well as for borrowing books. Library staff report that demand for computers is often greater than supply, and that queues form each morning before the doors open. In some areas, closures have prompted volunteers to take over buildings and run them without paid staff. Supporters of this approach praise the community spirit it shows, while critics argue that trained librarians cannot easily be replaced by enthusiastic amateurs. The debate has not been settled, and councils continue to look for savings.",
"Librarians are now rethinking their role. Some have added cafés, meeting rooms and workshops where visitors can use 3D printers. A few libraries even lend tools, seeds and musical instruments. Supporters say this keeps libraries at the heart of their communities. Not everyone welcomes these changes. Some readers worry that noisy activities may disturb those who come to study in silence, and some librarians fear that their traditional skills of cataloguing and advising readers are being pushed aside. Others reply that libraries have always adapted to new technology, and that the central aim of sharing knowledge freely has not changed. Surveys suggest that visitors generally welcome the wider range of activities."],

P3("The Problem of Space Debris",[
"Since Sputnik was launched in 1957, humans have put thousands of satellites into orbit. Most are now useless, and they have been joined by spent rocket stages, flecks of paint and fragments from collisions. Space agencies track about 30,000 objects larger than ten centimetres, but there are millions of smaller ones. Orbits close to Earth are especially crowded, because they are cheap to reach and useful for photographing the planet and relaying communications. Over the decades, the number of launches has grown steadily, and each mission usually leaves behind some discarded hardware. Tracking all of this material is a demanding task carried out by radar and telescopes around the world, and the figures are updated every day. Objects below the size limit mentioned above are too small to follow, yet they remain numerous and capable of causing serious damage.",
"Size is deceptive. Objects in low orbit travel at about 28,000 kilometres an hour, so even a screw can strike with the force of a hand grenade. In 2009, an active communications satellite collided with a defunct Russian one, creating over two thousand trackable fragments. Some scientists fear a 'Kessler syndrome', in which collisions create debris that causes further collisions, until some orbits become unusable. Operators of working satellites already spend considerable time planning avoidance manoeuvres, firing small engines to move out of the path of a passing object. Each manoeuvre uses fuel, which shortens the useful life of the satellite. The International Space Station has also had to change its orbit on several occasions after warnings that a piece of debris would pass close by. Astronauts have sometimes been told to shelter in their return capsule as a precaution.",
"That outcome may be exaggerated, but it would be unwise to ignore it. Satellites now provide navigation, weather forecasts and banking communications, and the number being launched is rising sharply as companies build networks of thousands of small satellites. Critics argue that regulators have been too slow to respond. Several companies have promised to operate responsibly, pointing out that their own satellites would be at risk from debris. Even so, the sheer number planned means that a single failure could affect many spacecraft at once. Some astronomers have added a separate complaint, that large networks of bright satellites interfere with observations of the night sky. Regulators in several countries have begun to draft new rules, but progress has been uneven, and agreements between nations are difficult to reach.",
"Several solutions have been proposed. Some engineers suggest using nets, harpoons or robotic arms to capture large dead satellites. Others favour lasers that would nudge small fragments into lower orbits where they burn up. These ideas are promising, but all are costly, and no country wants to pay to clean up debris that belongs to others. Engineers have tested some of these ideas in small experiments. In one trial, a net was fired at a model target in space, and in another a magnetic device was used to attach to a dummy satellite. Such tests show that the principles work, but turning them into routine services would require much larger budgets. Satellite operators have therefore been asked to consider sharing the costs, though no agreement has so far been reached.",
"In the writer's view, prevention is more realistic than cleaning. New satellites can be designed to descend and burn up within five years of finishing their work. If such rules were applied internationally, the problem would at least stop growing. Some operators have already adopted the shorter descent period voluntarily, and spacecraft makers are developing low-cost engines that can guide a satellite back through the atmosphere automatically. The writer admits that rules on their own cannot remove the debris already in orbit, but argues that stopping the problem from growing would give scientists more time to develop affordable cleaning methods."],
true,

{title:"Reading Passage 1",intro:"The Octopus: A Remarkable Mind",text:[
"Octopuses have around 500 million neurons, a number comparable to that of a dog, yet two thirds of these are located not in the brain but in the arms. Each arm can therefore taste, touch and make simple decisions independently. Each arm contains clusters of nerve cells that allow it to carry out simple tasks without waiting for instructions from the brain, which helps explain the way an arm can seem to explore a crevice on its own. Scientists who study this arrangement describe it as a form of distributed control, quite unlike the centralised system found in mammals. The animal's three hearts and blue blood, which carries oxygen efficiently in cold water, are further signs of how different its biology is from ours. Marine biologists often remark that studying an octopus is the closest most people will come to meeting an intelligent being that evolved on an entirely separate branch of life.",
"In laboratory tests, octopuses have unscrewed jars to reach food and learned to recognise individual human keepers. One aquarium in New Zealand reported that an octopus escaped each night through a drain to eat fish in a neighbouring tank, returning before morning. Keepers at several research centres have also noticed that individual animals seem to have distinct personalities, with some behaving boldly and others cautiously when a new object is placed in the tank. Such differences are difficult to measure, and researchers are careful not to assume that human emotions apply. Even so, the ability to learn by trial and error, and to remember the outcome, is widely accepted. Some laboratories now provide puzzles and toys, on the grounds that a bored animal is more likely to behave abnormally and so give unreliable results.",
"Despite this intelligence, octopuses live short lives, typically one to two years. Females guard their eggs without eating until they hatch, and then die. Some biologists believe that this early death prevents octopuses from passing knowledge to the next generation. Because each generation must learn almost everything for itself, an octopus cannot pass on discoveries to its young in the way that many birds and mammals do. Biologists have long wondered what such a species might achieve if its life were longer. Some argue that a short life is the price paid for rapid growth and large numbers of offspring, a strategy that has served many sea creatures well for millions of years. Others point out that the question cannot be answered until more is known about the animals' natural behaviour, which is hard to observe in deep water.",
"Because they lack a skeleton, octopuses can squeeze through any gap larger than their beak. Researchers are using this feature to design soft robots for rescue work in collapsed buildings. Engineers find this combination of strength and flexibility attractive, since conventional machines made from rigid parts struggle to move through narrow or irregular spaces. Prototype grippers modelled on octopus arms can pick up delicate objects without crushing them, and several teams are studying how the skin changes colour and texture to blend with the background. Conservationists add that the same curiosity that makes these animals interesting to scientists also makes them vulnerable, as fishing and changes in ocean temperature affect many coastal species around the world."],

{title:"Reading Passage 2",intro:"Why Do We Dream?",text:[
"For centuries, dreams were thought to carry messages from gods or the dead. In 1900, Sigmund Freud proposed that they were disguised expressions of hidden wishes, a theory that dominated psychology for decades but was hard to test. Interpreters in many cultures kept detailed records of what people dreamed, and rulers sometimes made important decisions on the basis of a dream reported by an adviser. By the nineteenth century, writers and physicians had begun to look for natural explanations, but the tools needed to study the sleeping brain did not yet exist. Researchers had to rely on what people remembered after waking, which is notoriously unreliable, since most dreams fade within minutes. This difficulty explains why dream research advanced so slowly compared with other areas of psychology.",
"In the 1950s, Eugene Aserinsky discovered rapid eye movement (REM) sleep, the phase when most vivid dreaming occurs. Later, Michel Jouvet showed that cats whose brains were altered to move during REM sleep appeared to act out dreams, suggesting that dreaming has a biological basis. The discovery encouraged laboratories to wake volunteers during REM sleep and ask what they had been experiencing, producing the first large collections of dream reports. Participants woken at such moments usually described detailed and often unusual scenes, whereas those woken at other times gave shorter and less vivid accounts. Recording devices also revealed that the brain's activity during REM sleep resembles its activity during waking in several respects, which surprised many scientists and led to the nickname of paradoxical sleep.",
"Allan Hobson argued in 1977 that dreams are simply the brain's attempt to make sense of random electrical signals. Critics replied that this could not explain why dreams often contain emotional themes, and Matthew Walker has argued that REM sleep helps to process painful memories, so that the emotion fades. The proposal was attractive to many neuroscientists because it linked dreaming to measurable activity in particular regions of the brainstem. It also offered a simple explanation for the sudden changes of scene that so many dreamers describe. Yet the theory was challenged on practical grounds as well, since people woken from non-REM sleep also report dreams, and these are not easy to explain by the same mechanism. Later versions of the idea were revised to take such findings into account, and the debate continues in modified form.",
"Others, such as Antti Revonsuo, claim that dreams are a kind of training: the brain rehearses threats in a safe setting. Evidence is limited, but dreamers do report being chased or attacked far more often than they experience pleasant events. Researchers who favour this view point out that threats appear in dreams far more often than would be expected from everyday life. Studies in several countries have found that people from very different cultures report similar kinds of frightening situations. Sceptics reply that this may simply reflect the kinds of experiences that people choose to remember and describe. Because dreams cannot be observed directly, every theory depends on accounts from the dreamers themselves, and that limits how far any claim can be tested."],

P3("The Return of the Night Train",[
"Night trains were once a pillar of European travel, but by 2010 many routes had been closed because budget airlines offered cheaper and faster journeys. Operators claimed that sleeper services were too costly to maintain, as carriages are older and carry fewer passengers per metre than day trains. At their peak, sleeper services linked cities across the continent, carrying commuters, holidaymakers and families who valued the chance to wake up in a new place. Operating them was never simple, however. Special carriages needed constant maintenance, and staff had to work through the night. When national railways were reorganised and asked to reduce losses, services that attracted fewer passengers were the first to be cancelled, often with little public discussion of what would be lost.",
"Yet attitudes are shifting. Concern over aviation emissions has led some passengers to seek alternatives, and Austria's national railway has expanded its night network to more than twenty cities. Its success, however, owes as much to government subsidy as to demand, which suggests that enthusiasm alone cannot sustain the model. Travel writers and bloggers have helped to make the sleeper fashionable again, publishing accounts of journeys through mountain scenery and describing the experience of falling asleep in one country and waking in another. Several younger travellers interviewed by journalists said that the slower pace was part of the appeal rather than a drawback. Ticket booking has also become easier, as online systems now allow passengers to combine routes run by different companies in a single purchase.",
"Critics point out that a night train journey of twelve hours will never compete with a two-hour flight for business travellers. This view overlooks the fact that a sleeper saves a hotel night and a day of work, an advantage that has hardly been measured in official studies. Supporters respond that the comparison is unfair, because the time spent travelling at night is time that would otherwise be spent asleep. They also note that city centre stations are usually more convenient than airports, which are often far from the places travellers actually want to reach. Nevertheless, even enthusiasts admit that long distances remain a challenge, and that some routes are better suited to sleeper services than others, depending on the distances involved and the cities they connect.",
"It would be naive to expect a full revival. But with new carriages on order and several international operators cooperating on timetables, night trains seem set to become a lasting niche rather than a nostalgic curiosity. Planners say that success will depend on reliable timetables, comfortable carriages and fares that passengers consider fair. Each of these requires investment, and the people making such decisions must weigh the benefits against competing demands on public money. The experience of the past decade shows that interest can grow quickly, but also that it can fade if services are unreliable. For that reason, supporters of the revival are cautious about promising more than the evidence allows."],
true,

P1("The Story of Tea",[
"Tea is the most popular drink in the world after water. According to legend, it was discovered in China around 2700 BC, when leaves from a wild tree blew into the boiling water of Emperor Shennong. He tried the drink and liked it. Historians believe that people first chewed the leaves as medicine before anyone thought of brewing them. Over many centuries, the drink spread from southern China to other parts of Asia, where it became closely connected with religious ceremonies and social customs. In Japan, for example, a formal tea ceremony developed in which every movement of the host is carefully planned. These traditions show that tea has always been valued for more than its taste.",
"Tea reached Europe in the seventeenth century, brought by Dutch traders. It was very expensive at first, and only rich families could afford it. In Britain, drinking tea became fashionable after 1662, when the king married a Portuguese princess who loved it. At first, merchants sold it in small quantities from coffee houses, where men met to talk about business and politics. Tea was stored in locked boxes in wealthy homes, and the key was often kept by the lady of the house. Doctors recommended it for a variety of complaints, although few of these claims were ever proved. The drink gradually became part of social life, and special cups, pots and tables were produced for serving it.",
"Over time, tea became cheaper because it was grown in India and Sri Lanka, as well as in China. By the nineteenth century, workers in factories were drinking tea during their breaks, and it became part of everyday life. Large estates were created in the hills, and thousands of workers were employed to pick the leaves by hand. Railways and steamships carried the tea to ports much faster than before, so that it reached shops while still fresh. New varieties were also developed to suit different tastes, and advertising encouraged families to buy it. As prices fell, the habit of drinking several cups a day spread through every level of society.",
"Today, there are hundreds of types of tea, but all of them come from the same plant. The difference lies in the way the leaves are dried and processed. Green tea is dried quickly, while black tea is left to change colour first. Green tea is dried quickly to keep its colour, while oolong lies somewhere between the two. Producers also add flowers, spices or fruit to create scented blends, which are popular in many countries. Scientists continue to study whether tea has benefits for health, and early results are promising, although more research is needed. Whatever the answer, the drink remains one of the cheapest and most widely enjoyed in the world, served hot or cold, with or without milk."],

P2("Why Do People Visit Museums?",[
"The oldest museums were private collections owned by rich families who displayed rare objects to impress their guests. Ordinary people were rarely allowed to enter. Some of these owners employed scholars to describe their objects and to prepare catalogues for important visitors. The displays were arranged to show wealth and learning, and often mixed natural objects, works of art and curious machines in one room. Because there were no printed guides, the owner or a servant usually led guests from one cabinet to the next. Collections of this kind were later given to the state or sold, and they formed the basis of many great museums.",
"The first public museum, the British Museum, opened in 1759. Entry was free, but visitors had to apply in writing, and only a small number were accepted each day. The museum was housed in a large mansion in London, and its collections included books, manuscripts and natural history specimens. Visitors were expected to dress well and to behave quietly, and guides led small groups through the rooms at a fast pace. Many complained that they were not given enough time to look at anything properly. Over the following decades, the rules were relaxed, and more people were able to enjoy the displays.",
"In the twentieth century, museums began to think about their visitors. They added labels in simple language, cafés and shops, and special activities for children. Teachers began to bring school groups, and educational departments were set up to prepare materials for them. Designers studied how people move through a building and changed the layout so that visitors could find their way more easily. Some museums also opened late on certain evenings, which allowed people with full-time jobs to attend. Visitor surveys became common, and the results were used to decide which exhibitions to hold and how long to keep them open.",
"Today, many museums use technology. Visitors can scan a code with their phone to hear a guide or see a 3D model of an object. Some museums even offer virtual tours online. Curators say that digital tools make it possible to show items that are too fragile to display, or too large to fit in a gallery. Online catalogues allow researchers to study collections from anywhere in the world, and some museums share images that anyone may download and use. Younger visitors, who are used to screens, often find it natural to explore an exhibition on a tablet. Museum directors hope that this will help them to reach people who might never otherwise have walked through the door.",
"However, not everyone is happy with these changes. Some experts worry that screens distract people from real objects. Others say that technology brings in younger visitors who would otherwise stay away. Another concern is cost. Developing apps and interactive displays requires specialist staff, and equipment quickly becomes out of date. Some smaller museums cannot afford such projects and fear that they will fall behind larger institutions. Visitors have mixed opinions as well: while many welcome extra information, others prefer to look at objects in silence and form their own impressions. Most experts agree that technology should add to the experience rather than replace it."],

P3("Working from Home",[
"Before 2020, only about five per cent of employees in Europe worked mainly from home. When offices closed during the pandemic, millions of people had to change their way of working almost overnight. Working from home had mainly been common among writers, programmers and people who ran their own businesses. Many managers believed that employees were less productive when they could not be seen, and few companies had the systems needed to support remote work. Rules about insurance, taxes and equipment were also unclear in many countries. As a result, even when workers asked for flexible arrangements, they were often refused.",
"Many workers enjoyed the change. They saved time and money on travel, and some said they could concentrate better at home. Companies also noticed that they could save money on office space. Parents said that being at home made it easier to look after children, and some employees moved to quieter towns where housing was cheaper. Meetings, which had often been long, were held by video and tended to be shorter. Several firms reported that fewer staff left their jobs during this period. Studies suggested that the effects varied by profession, with tasks that require little cooperation being easiest to do from a distance.",
"However, there were also problems. Some people felt lonely and found it hard to separate work from private life. Others lacked a quiet room or a good internet connection. Younger employees, in particular, missed learning from colleagues. Workers who were new to a company found it particularly difficult to understand its culture, because many things are learned informally by watching others. Some employees also found that they worked longer hours than before, since messages could arrive at any time of the day. Health experts warned that sitting for long periods in poorly designed chairs could cause back problems. Employers began to offer advice and, in some cases, financial help for equipment.",
"Now, many companies have chosen a middle path called hybrid working, in which employees spend two or three days a week in the office. Surveys suggest that most workers prefer this arrangement. Managers say that this arrangement allows people to meet colleagues in person for planning and training, while keeping the benefits of working at home on other days. Some firms have reduced the size of their offices and replaced fixed desks with shared spaces that can be booked in advance. The change is also affecting cities, as shops and cafés near business districts adapt to different patterns of customers. Experts expect that arrangements will continue to develop as technology and attitudes change. Employees who value flexibility often say that being able to choose their working days improves their mood and their loyalty to the company. Human resources departments are therefore being asked to write clearer policies, so that people working on different days are treated fairly when decisions about training and promotion are made."],

X(6,0,["Without them, supermarkets would offer a much narrower choice of fruit and vegetables, and prices would rise. A single colony can contain as many as fifty thousand individuals in midsummer.","The disappearance was surprising partly because dead bees were rarely found near the empty hives, which made investigation difficult. Researchers had to rely on careful records kept by beekeepers over many years.","Climate also plays a part. Warmer springs cause flowers to open earlier, so that bees may emerge when little food is available. Some beekeepers now move their hives long distances by lorry to follow the flowering seasons.","Governments in several countries have introduced training schemes and small grants for amateur beekeepers. Schools have also begun keeping hives, hoping that children who understand bees will grow up to protect them."]);
X(6,1,["Books had to be copied by hand until printing spread across Europe, so even a small collection represented great wealth. Reading aloud was common, because many people who could listen could not read.","The first librarians were often poorly paid, and early buildings were usually converted houses rather than purpose-built halls. Even so, the number of borrowers grew steadily through the following decades.","Carnegie's own childhood had been poor, and he later said that a free library had given him his education. His gifts also encouraged other wealthy donors to follow his example in many countries.","Local councils must now decide how to divide limited budgets between libraries, schools and roads. Campaigners have organised protests and, in some villages, volunteers have taken over the running of closed branches.","Meanwhile, digital services allow members to borrow electronic books and newspapers without leaving home. Surveys show that these services are used most by commuters and by people living far from a branch."]);
X(6,2,["Tracking technology has improved greatly in recent decades, but experts admit that many small fragments still cannot be followed at all.","Astronauts on the International Space Station have occasionally been told to shelter in an escape capsule while a fragment passed nearby. The station's windows have also been chipped by tiny particles of paint.","Insurance companies have begun to charge higher premiums for satellites launched into crowded orbits. This shows that the commercial risk is already being taken seriously.","Another proposal is to refuel old satellites rather than abandon them, which would reduce the number of launches needed. So far, however, only a few experimental missions have been attempted.","Some countries have already adopted such rules for their own satellites, though enforcement remains difficult. The writer concludes that agreement between governments is the missing ingredient rather than technology."]);
X(7,0,["Their brains are also unusually shaped, with large areas devoted to vision and touch. Scientists have compared this to the structure found in some birds, although the two groups are only distantly related.","Keepers at several aquariums report that individual octopuses behave differently from one another, with some being bold and others shy. One animal reportedly squirted water at a particular visitor every time he approached the glass.","Cuttlefish and squid, which are relatives of the octopus, also have short lives. By contrast, a few deep-sea species are thought to live for several years because the cold water slows their growth.","Engineers face a difficult challenge, since soft machines are hard to control without a rigid frame. Early prototypes have been able to crawl and grasp objects, but their movements remain much slower than those of a real animal."]);
X(7,1,["Ancient Egyptians recorded dreams on papyrus and employed priests to interpret them. In Greece, sick people slept in temples in the hope that a dream would reveal a cure.","Aserinsky made his discovery by chance while testing a new machine that recorded the movements of sleepers' eyes. His assistant at first suspected that the equipment was faulty. Subsequent studies confirmed that people woken during this phase usually described vivid stories.","Hobson's later work moved away from his original position, accepting that the brain gives dreams some meaning even if their starting point is random. The debate between the two camps has therefore become less sharp than it once was.","Researchers who favour this view note that many animals, including cats and rats, also show REM sleep. They suggest that the habit developed because it gave young animals a chance to practise survival skills without risk."]);
X(7,2,["Rail enthusiasts often point out that sleeper compartments once offered a comfortable alternative to a hotel, with beds, washbasins and sometimes even a dining car. Such facilities, however, require staff and space that modern operators find expensive.","Several other countries have studied the Austrian model, though their governments have been reluctant to commit similar sums. Ticket prices on night routes are often higher than those of daytime trains, which may limit their appeal to students and families.","Environmental campaigners argue that the comparison with flying should include the damage caused by short-haul flights, which they say is rarely reflected in ticket prices. Airlines reply that fuel efficiency is improving every year.","Rail companies also see an opportunity in tourism, since passengers who arrive in the morning can begin sightseeing immediately. Whether this will be enough to fill new carriages remains to be seen."]);
X(8,0,["Another story says that a Buddhist monk, Bodhidharma, cut off his eyelids to stay awake, and that the first tea plant grew where they fell. Historians treat this tale as a myth, but it shows how closely tea was linked with alertness in Asia.","Merchants carried tea across Europe in wooden chests lined with metal to protect it from damp. A journey from China could take more than a year, which partly explains the high price.","Tea plantations grew rapidly, and many workers moved from villages to live on large estates. Ships called clippers were built for speed, and races between them to bring the first tea of the season home were followed eagerly in newspapers.","Many people prefer to add milk to black tea, while green tea is usually drunk plain. Herbal drinks, sometimes called herbal teas, are not true teas because they are made from other plants."]);
X(8,1,["Some of these collections included stuffed animals, fossils, coins and unusual souvenirs brought back by travellers. Owners often kept them in special rooms called cabinets of curiosities.","Famous visitors in the early years included scientists and artists, who were often allowed to stay longer than other guests. The museum's first collection came from a doctor and collector whose will left thousands of objects to the nation.","Many museums also opened on evenings and weekends so that people who worked during the day could visit. Schools began to organise regular trips, and teachers were given materials to use in lessons.","Interactive screens let children match objects to their countries, and some displays respond to touch or movement. Museums say that data from these systems helps them to learn which exhibitions are most popular.","Critics add that the cost of installing and updating equipment can take money away from caring for the collections. Supporters reply that money from larger audiences can pay for both."]);
X(8,2,["Telecommunication companies reported a sharp rise in the use of video calls, and sales of home office furniture increased in many countries. Some cities saw traffic fall noticeably during the first months.","Parents with young children, however, often found it difficult to work and look after them at the same time. Managers had to learn new ways of supervising staff they could not see.","Employers began to offer online social events and short daily phone calls to keep teams in touch. Some also paid for equipment such as desks and chairs so that employees could work comfortably.","City centre cafés and shops, which depended on office workers, have had to adapt to the lower number of customers. Property experts expect that some office buildings will be converted into flats."]);

S("Section 3","Ikki talaba va ustoz: loyiha muhokamasi (multiple choice + matching).","a discussion between a tutor and two students about their research project on food waste",[
["Tutor","Come in, both of you, and sit down. I've read your draft report on food waste in the university canteen, and I'd like to go through it before you submit it."],
["Anna","Thanks, Doctor Reeves. We're a bit nervous, to be honest."],
["Tutor","There's no need to be. Let's start at the beginning. Anna, what first made you choose this topic? I remember you'd proposed something on energy use."],
["Anna","Yes, that was my first idea. I'd also watched a documentary about supermarket waste, which got me thinking. But what really decided it was my summer job in a café, where I saw how much perfectly good food was thrown away every evening."],
["Tutor","A good starting point. Now, the survey. You were hoping for two hundred responses, I think?"],
["Ben","That's right, but we only got a hundred and twenty. At first we thought the questions might be confusing, so we rewrote them, but the real problem was the timing. We handed the survey out during exam week, and most people just didn't have time."],
["Tutor","Understandable. So what did the survey tell you about why students waste food?"],
["Anna","Ben was sure the portions were too big."],
["Ben","I was, at the start. But the data says something different. Most people said they left food because they didn't like what they'd picked, and there simply wasn't much to choose from."],
["Tutor","That's interesting, and it's worth highlighting. Did you compare your figures with other universities?"],
["Anna","We tried to. The trouble was that the other universities collected their figures in a different way, so the numbers couldn't really be compared. We decided to leave them out."],
["Tutor","That's sensible. One concern, though. You only observed the bins for a week."],
["Ben","We'd have liked two weeks, but the canteen manager only allowed us in for five days."],
["Tutor","Then don't hide it. Explain it as a limitation in your report. I wouldn't repeat the observation, because that would take too long at this stage."],
["Anna","Okay, we'll do that."],
["Tutor","Now, for the end-of-term presentation. Have you thought about how to present your findings?"],
["Ben","We considered showing a short video of the bins being sorted, but the editing would take ages."],
["Anna","So we've agreed on a leaflet with the main figures, which we'll hand out."],
["Tutor","Good, that's realistic. Right, let's go through the draft section by section. The introduction first. It runs to nearly two pages, which is far too much. Aim for half that."],
["Tutor","The methodology is clear and well organised. I have no complaints there."],
["Tutor","The results section lists lots of figures, but you don't say what they mean. I'd like to see much more discussion."],
["Tutor","And the conclusion is only three lines long. You need to say a lot more about what the university should do."],
["Anna","Fine, we'll work on that this week."]
],[

S("Section 4","Universitet ma'ruzasi: yashil tomlar (note completion).","a university lecture about green roofs",[
["","Good afternoon, everyone. Today I'm going to talk about green roofs, which are roofs partly or completely covered with plants. They might sound like a modern idea, but in fact they have a long history. In Scandinavia, houses were traditionally covered with turf, which was cut from the ground and laid on the roof, mainly because it kept the heat in during the long winters. The modern green roof, however, was developed in Germany in the nineteen sixties, and Germany is still the country with the most green roofs today."],
["","Now, how is a green roof built? At the very bottom there is a waterproof membrane, which protects the building from leaks. Above that comes a drainage layer, which lets any extra water run away so that the roots don't rot. The top layer is soil, and on top of that go the plants. Most designers choose sedum, a low plant with thick leaves, because it survives on very little water and almost no soil."],
["","Let's turn to the benefits. The first is that green roofs reduce the amount of stormwater flowing into the drains after heavy rain, which helps to prevent floods in cities. Second, they keep buildings cooler. On a hot day the surface of an ordinary roof can be thirty degrees hotter than the air, but a green roof can reduce that surface temperature by up to twenty degrees. Third, they're good for wildlife. Roofs have become important habitats for insects, especially bees and butterflies, in cities where parks are scarce."],
["","But there are also disadvantages. The most important is cost. Installing a green roof is much more expensive than building a normal one, which is why many property owners hesitate. They also need regular maintenance, especially the removal of weeds, although sedum roofs need much less attention than roofs planted with ordinary grass."]
],[

["Marcus","Hi Hannah. Have you finished writing up the methods section of our music experiment?"],
["Hannah","Nearly. I wanted to check a few things with you first. Remind me why you wanted to study background music in the first place?"],
["Marcus","Well, I can never concentrate in complete silence, whereas my flatmate says any sound distracts her. I wondered whether there was a general pattern."],

["Marcus","Yes, so we agreed to use first-year psychology students as participants. I'd wanted to ask the university orchestra, but they were rehearsing all month."],
["Hannah","And the music. We tested three conditions, didn't we?"],
["Marcus","Silence, songs with lyrics, and instrumental music. I'd suggested classical, but then we realised some people have strong feelings about it, so we used instrumental film music instead."],
["Hannah","The task was a reading comprehension test, and the results were interesting. Songs with lyrics lowered the scores by about ten per cent, but the instrumental music made hardly any difference."],
["Marcus","So it was about the same as silence. That's worth mentioning in the discussion."],
["Hannah","Definitely. Now, we should also describe the problems we had, because the tutor wants that in the evaluation. Finding participants was the hardest. We'd hoped for forty, but only twenty-eight turned up."],

["","Today's lecture is about a remarkable natural material: cork. Many people think of cork as a kind of wood, but it is actually the bark of the cork oak tree. The trees are never cut down to get it. Instead, the bark is carefully stripped by hand. A tree can be harvested for the first time when it is about twenty-five years old, although the first harvest is not good quality. After that, the bark grows back and can be harvested every nine years, and a tree may live for around two hundred years."],
["","Portugal is the world's biggest producer, supplying about fifty per cent of all cork, while Spain provides about thirty per cent. So what makes cork so useful? One property is that it hardly burns. It doesn't catch fire easily, which is why it is used in buildings. Another is that it is very light and springy, because each of its cells is filled with air."],
["","Turning to its uses, the best known is bottle stoppers, especially for wine. In fact, about two thirds of all cork goes into stoppers for wine bottles. Cork is also used for flooring in homes, since it is warm and comfortable underfoot. Perhaps less well known is its use in space. Engineers have used cork to protect spacecraft from extreme heat during re-entry."],
["","Finally, the environment. Cork forests absorb large amounts of carbon dioxide, and they provide a home for endangered animals such as the Iberian lynx."]
],[

["","Today I'm going to discuss urban heat islands, the effect by which cities are warmer than the surrounding countryside. The difference can reach five degrees at night. The main cause is materials. Dark surfaces such as asphalt absorb sunlight and release it slowly after sunset. A second cause is the lack of vegetation. Trees cool the air through a process called evapotranspiration, so cities with fewer trees are hotter."],
["","Third, the shape of buildings matters. Tall buildings trap heat in narrow streets, which researchers call urban canyons. Waste heat from air conditioning and traffic adds to the problem."],
["","The effects are serious. Hot nights increase hospital admissions, particularly among elderly people, and energy use rises by up to ten per cent in summer."],
["","Solutions include painting roofs white, which can reflect up to eighty per cent of sunlight, and planting green roofs. In Singapore, new buildings must include gardens. In Chicago, planting trees along the streets has reduced temperatures by two degrees. My next lecture will look at flooding."]],[
